version: "3.9"

services:

  db:
    image: pgvector/pgvector:pg16
    container_name: mediquery-db
    environment:
      POSTGRES_USER: mediquery
      POSTGRES_PASSWORD: mediquery
      POSTGRES_DB: mediquery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediquery"]
      interval: 5s
      timeout: 5s
      retries: 5

api:
  build: .
  container_name: mediquery-api
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  volumes:
    - .:/app
  ports:
    - "8000:8000"
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy

frontend:
  build: .
  container_name: mediquery-frontend
  command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
  volumes:
    - .:/app
  ports:
    - "8501:8501"
  env_file:
    - frontend/.env
  depends_on:
    - api
  
volumes:
  pgdata: